<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Whiteboarding – Draw.io Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <h1>Whiteboarding</h1>
        <div class="mode-indicator">Mode: <span id="mode-label">Select</span></div>
      </header>

      <div class="toolbar" role="toolbar">
        <button class="tool-button active" data-mode="select" title="Select (V)">
          Select
        </button>
        <button class="tool-button" data-mode="rectangle" title="Rectangle (R)">
          Rectangle
        </button>
        <button class="tool-button" data-mode="arrow" title="Arrow (A)">
          Arrow
        </button>
        <button class="tool-button" data-mode="text" title="Text (T)">Text</button>
      </div>

      <div class="hint" id="hint">
        Two-click creation: pick a tool, set a start point, then click again to finish.
        Use edges/corners to resize rectangles. Type to edit labels.
      </div>

      <div class="canvas-container">
        <svg id="board" viewBox="0 0 1400 900" tabindex="0">
          <defs>
            <pattern id="grid-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
              <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="1" />
            </pattern>
            <marker
              id="arrow-head"
              viewBox="0 0 10 10"
              refX="10"
              refY="5"
              markerWidth="6"
              markerHeight="6"
              orient="auto-start-reverse"
            >
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#3f51b5" />
            </marker>
          </defs>
          <rect width="1400" height="900" fill="url(#grid-pattern)" />
          <g id="shape-layer"></g>
          <g id="handle-layer"></g>
          <g id="overlay-layer"></g>
        </svg>
      </div>
    </div>
    <script src="app.js"></script>
  </body>
</html>
