<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Whiteboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Toolbar -->
        <div class="toolbar">
            <h2>Tools</h2>
            <div class="tool-group">
                <button id="selectTool" class="tool-btn active" title="Select (V)">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M3 3 L3 20 L10 13 L15 22 L17 21 L12 12 L21 10 Z" fill="currentColor"/>
                    </svg>
                    <span>Select</span>
                </button>
                <button id="rectangleTool" class="tool-btn" title="Rectangle (R)">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <rect x="4" y="6" width="16" height="12" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>Rectangle</span>
                </button>
                <button id="textTool" class="tool-btn" title="Text (T)">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <text x="12" y="18" text-anchor="middle" font-size="18" fill="currentColor">T</text>
                    </svg>
                    <span>Text</span>
                </button>
                <button id="arrowTool" class="tool-btn" title="Arrow (A)">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M4 12 L20 12 M20 12 L15 7 M20 12 L15 17" fill="none" stroke="currentColor" stroke-width="2"/>
                    </svg>
                    <span>Arrow</span>
                </button>
            </div>

            <div class="divider"></div>

            <div class="style-group">
                <label>
                    <span>Fill Color</span>
                    <input type="color" id="fillColor" value="#e3f2fd">
                </label>
                <label>
                    <span>Stroke Color</span>
                    <input type="color" id="strokeColor" value="#1976d2">
                </label>
                <label>
                    <span>Stroke Width</span>
                    <input type="range" id="strokeWidth" min="1" max="5" value="2">
                    <span id="strokeWidthValue">2</span>
                </label>
                <label id="rotationControl" style="display: none;">
                    <span>Text Rotation</span>
                    <input type="range" id="textRotation" min="0" max="360" value="0">
                    <span id="textRotationValue">0°</span>
                </label>
            </div>

            <div class="divider"></div>

            <div class="action-group">
                <button id="deleteBtn" class="action-btn">Delete (Del)</button>
                <button id="clearBtn" class="action-btn">Clear All</button>
            </div>

            <div class="info">
                <p><strong>Shortcuts:</strong></p>
                <p>V - Select</p>
                <p>R - Rectangle</p>
                <p>T - Text</p>
                <p>A - Arrow</p>
                <p>Del - Delete</p>
            </div>
        </div>

        <!-- Canvas -->
        <div class="canvas-container">
            <svg id="canvas" width="100%" height="100%">
                <!-- Grid pattern -->
                <defs>
                    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
                        <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#e0e0e0" stroke-width="0.5"/>
                    </pattern>
                    <!-- Arrow marker -->
                    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
                        <polygon points="0 0, 10 3, 0 6" fill="#1976d2"/>
                    </marker>
                </defs>
                <!-- Grid background -->
                <rect width="100%" height="100%" fill="url(#grid)"/>
                <!-- Drawing layer -->
                <g id="drawingLayer"></g>
            </svg>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
